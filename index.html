<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <!-- ෆෝන් එකේ Zoom වෙන එක නවත්වන්න විශේෂ meta tag එකක් -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise! ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; /* Screen එක Scroll වෙන එක නවත්වයි */
        }
        h1 { 
            color: #d63031; 
            margin: 0 20px 30px 20px;
            font-size: 24px;
        }
        .btn-container {
            position: relative;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Button දෙක අතර පරතරය */
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.1s;
        }
        #yes-btn {
            background-color: #2ecc71;
            color: white;
            z-index: 10;
        }
        #yes-btn:active {
            background-color: #27ae60;
            transform: scale(0.95);
        }
        #no-btn {
            background-color: #e74c3c;
            color: white;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1 id="question">අපි ළඟදිම Galle පැත්තේ ලස්සන Date එකක් යමුද? 🌊❤️</h1>
    
    <div class="btn-container" id="btn-container">
        <button id="yes-btn" onclick="sayYes()">ඔව් 😍</button>
        <!-- Mobile වලට ontouchstart එකතු කර ඇත -->
        <button id="no-btn" onmouseover="moveNoBtn()" ontouchstart="moveNoBtn()" onclick="moveNoBtn()">බෑ 😢</button>
    </div>

    <script>
        function moveNoBtn() {
            const noBtn = document.getElementById('no-btn');
            
            // Button එක Screen එකෙන් එළියට නොයන විදිහට සීමා කිරීම
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function sayYes() {
            document.getElementById('question').innerText = "යේ! ලෑස්ති වෙලා ඉන්න එහෙනම්! 🥰🎉";
            document.getElementById('btn-container').style.display = 'none';
            
            // පසුබිම වෙනස් කිරීම
            document.body.style.backgroundColor = "#fd79a8";
            document.getElementById('question').style.color = "#ffffff";
            
            // Fireworks වගේ පොඩි effect එකක් (Optional)
            const noBtn = document.getElementById('no-btn');
            if(noBtn) noBtn.remove();
        }
    </script>

</body>
</html>
